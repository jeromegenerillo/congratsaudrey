<div class="ring" id="r1"></div><div class="ring" id="r2"></div><div id="conf"></div>
</div></div>
<script>
const $=i=>document.getElementById(i),GIF=location.search.includes('gif');
const cols=['#C92AE1','#8E7BFF','#FFFFFF','#5B57F0'],P=[];
for(let i=0;i<24;i++){const a=(-165+150*(i/23))*Math.PI/180,sp=4.5+((i*7)%6),s=4+(i%3)*2;const e=document.createElement('div');e.className='c';e.style.cssText+=`width:${s}px;height:${s}px;background:${cols[i%4]};display:none`;$('conf').appendChild(e);P.push({vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,e})}
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-x,3),eb=x=>{const c=1.3;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function ring(el,t){const on=t>0&&t<12;el.style.display=on?'block':'none';if(on){const d=74+t*12;el.style.width=el.style.height=d+'px';el.style.marginLeft=el.style.marginTop=-d/2+'px';el.style.opacity=1-t/12}}
window.setT=function(f){
 ring($('r1'),f-1);ring($('r2'),f-6);
 const fl=eo(cl((f-14)/14)),up=eb(cl((f-20)/24));
 $('front').style.transform=`rotateX(${-58*fl}deg)`;
 $('emblem').style.opacity=1-cl((f-15)/6);
 $('paper').style.top=(192-122*up)+'px';
 $('caption').style.opacity=1-cl((f-14)/6);
 const t=f-34;P.forEach(p=>{const on=t>0&&t<30;p.e.style.display=on?'block':'none';if(on){p.e.style.left=300+p.vx*t+'px';p.e.style.top=272+p.vy*t+.26*t*t+'px';p.e.style.opacity=1-cl((t-20)/10)}});
};
window.setT(0);
if(GIF){$('cta').textContent='Click to review & sign'}
else{
 $('stage').style.background='transparent';$('stage').style.overflow='visible';document.querySelectorAll('.cor').forEach(c=>{c.style.position='fixed';document.body.prepend(c)});
 const fit=()=>{const s=Math.min(innerWidth/600,innerHeight/400);$('wrap').style.transform=`scale(${s})`};addEventListener('resize',fit);fit();
 $('cta').tabIndex=-1;let done=false;
 const end=66,open=()=>{if(done)return;done=true;$('front').style.pointerEvents='none';$('front').tabIndex=-1;$('cta').tabIndex=0;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){setT(end);return}
  const t0=performance.now();(function tick(n){const f=(n-t0)/50;setT(Math.min(f,end));if(f<end)requestAnimationFrame(tick)})(t0)};
 $('front').addEventListener('click',open);
}
</script></body></html>
